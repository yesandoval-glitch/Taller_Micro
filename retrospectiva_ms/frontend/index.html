<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Retrospectivas</title>

    <link rel="stylesheet" href="css/general.css">

</head>
<body>

    <div class="container">

        <h1>Registro de Retrospectivas Scrum</h1>

        <!-- FORMULARIO -->
        <div class="formulario">

            <input 
                type="text" 
                id="sprint"
                placeholder="Nombre del Sprint"
            >

            <input 
                type="date"
                id="fecha"
            >

            <button onclick="crearRetrospectiva()">
                Guardar Retrospectiva
            </button>

        </div>

        <!-- LISTA -->
        <div class="lista">

            <h2>Retrospectivas Registradas</h2>

            <div id="retrospectivas-container">

            </div>

        </div>

    </div>

    <script src="js/retrospectivas.js"></script>

</body>
</html>
