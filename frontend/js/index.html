<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Retrospectivas Scrum</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ══ HEADER ══════════════════════════════════════════════════════════════ -->
  <header>
    <div class="header-content">
      <h1>📋 Registro de Retrospectivas Scrum</h1>
      <p>Gestiona los sprints y documenta cada retrospectiva del equipo</p>
    </div>
  </header>

  <!-- ══ MAIN ════════════════════════════════════════════════════════════════ -->
  <main>

    <!-- Alerta global -->
    <div id="alerta" class="alerta oculto"></div>

    <!-- ── Sección: Crear Sprint ─────────────────────────────────────────── -->
    <section class="seccion">
      <h2>➕ Registrar Nuevo Sprint</h2>

      <form id="form-sprint" class="form-grid" novalidate>

        <div class="form-group">
          <label for="nombre">Nombre del Sprint <span class="req">*</span></label>
          <input
            type="text"
            id="nombre"
            placeholder="Ej: Sprint 1"
            maxlength="100"
            required
          />
          <span class="campo-error" id="error-nombre"></span>
        </div>

        <div class="form-group">
          <label for="fecha_inicio">Fecha de Inicio <span class="req">*</span></label>
          <input
            type="date"
            id="fecha_inicio"
            required
          />
          <span class="campo-error" id="error-fecha_inicio"></span>
        </div>

        <div class="form-group">
          <label for="fecha_fin">Fecha de Fin <span class="req">*</span></label>
          <input
            type="date"
            id="fecha_fin"
            required
          />
          <span class="campo-error" id="error-fecha_fin"></span>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="btn-crear">
            Crear Sprint
          </button>
          <button type="reset" class="btn btn-secondary">
            Limpiar
          </button>
        </div>

      </form>
    </section>

    <!-- ── Sección: Lista de Sprints ─────────────────────────────────────── -->
    <section class="seccion">
      <div class="seccion-header">
        <h2>🏃 Sprints Registrados</h2>
        <button class="btn btn-sm btn-outline" onclick="cargarSprints()">🔄 Actualizar</button>
      </div>

      <div id="lista-sprints">
        <p class="cargando">Cargando sprints...</p>
      </div>
    </section>

  </main>

  <!-- ══ MODAL: Editar Sprint ════════════════════════════════════════════════ -->
  <div id="modal-editar" class="modal oculto" role="dialog" aria-modal="true">
    <div class="modal-content">

      <div class="modal-header">
        <h2>✏️ Editar Sprint</h2>
        <button class="btn-cerrar" onclick="cerrarModal()" title="Cerrar">✕</button>
      </div>

      <form id="form-editar" class="form-grid" novalidate>
        <input type="hidden" id="edit-id" />

        <div class="form-group">
          <label for="edit-nombre">Nombre <span class="req">*</span></label>
          <input type="text" id="edit-nombre" maxlength="100" required />
          <span class="campo-error" id="error-edit-nombre"></span>
        </div>

        <div class="form-group">
          <label for="edit-fecha_inicio">Fecha de Inicio <span class="req">*</span></label>
          <input type="date" id="edit-fecha_inicio" required />
          <span class="campo-error" id="error-edit-fecha_inicio"></span>
        </div>

        <div class="form-group">
          <label for="edit-fecha_fin">Fecha de Fin <span class="req">*</span></label>
          <input type="date" id="edit-fecha_fin" required />
          <span class="campo-error" id="error-edit-fecha_fin"></span>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">💾 Guardar cambios</button>
          <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        </div>
      </form>

    </div>
  </div>

  <!-- ══ SCRIPTS ══════════════════════════════════════════════════════════════ -->
  <!-- 1. api.js  → funciones fetch (debe ir primero) -->
  <!-- 2. sprints.js → lógica de la página               -->
  <script src="js/api.js"></script>
  <script src="js/sprints.js"></script>

</body>
</html>
